services:
  - type: web
    name: archivist
    env: go
    buildCommand: ./build.sh
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: archivist-db
          property: connectionString
      - key: GIN_MODE
        value: release
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
        sync: false

  - type: postgresql
    name: archivist-db
    plan: free
    ipAllowList: []
