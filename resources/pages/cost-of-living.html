{{define "content"}}
<div class="page-header">
    <div class="page-header-main">
        <h1>Costo de Vida</h1>
    </div>
    <div class="header-actions">
        <div class="search-box">
            <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input class="input" type="search" data-table-search="#col-table" placeholder="Buscar costo de vida...">
        </div>
    </div>
</div>

<div class="box">
    <p class="title is-5">Registrar Costo de Vida</p>
    <form method="POST" action="/cost-of-living" class="character-form" style="margin-bottom:1rem">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-row">
            <div class="field">
                <label class="label" for="date">Fecha</label>
                <div class="control">
                    <input class="input" type="date" id="date" name="date" required>
                </div>
            </div>
            <div class="field">
                <label class="label" for="character_id">Personaje</label>
                <div class="control">
                    <div class="select is-fullwidth">
                        <select id="character_id" name="character_id" required>
                            <option value="">Seleccionar...</option>
                            {{range .Characters}}
                            <option value="{{.ID}}">{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
            </div>
            <div class="field">
                <label class="label" for="amount">Monto</label>
                <div class="control">
                    <input class="input" type="number" step="any" id="amount" name="amount" required>
                </div>
            </div>
            <div class="field">
                <label class="label" for="notes">Notas</label>
                <div class="control">
                    <input class="input" type="text" id="notes" name="notes">
                </div>
            </div>
            <div class="field" style="align-self:flex-end">
                <div class="control">
                    <button type="submit" class="button is-primary">Agregar</button>
                </div>
            </div>
        </div>
    </form>

    {{if .Entries}}
    <div class="table-scroll">
        <table class="table is-fullwidth is-striped is-hoverable" id="col-table">
            <thead><tr><th>Fecha</th><th>Personaje</th><th>Monto</th><th>Notas</th><th>Acciones</th></tr></thead>
            <tbody>
                {{range .Entries}}
                <tr>
                    <td>{{.Date.Format "2006-01-02"}}</td>
                    <td><a href="/characters/detail/{{.CharacterID}}" class="char-link">{{.Character.Name}}</a></td>
                    <td class="has-text-danger">{{printf "%.2f" .Amount}}</td>
                    <td>{{.Notes}}</td>
                    <td class="table-actions">
                        <a href="/cost-of-living/{{.ID}}/edit" class="button is-small is-info is-light">Editar</a>
                        <form method="POST" action="/cost-of-living/{{.ID}}/delete" class="inline-form" data-confirm="¿Eliminar este registro?">
                            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                            <button type="submit" class="button is-small is-danger is-light">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
    {{else}}
    <div class="empty-state">
        <p class="empty-title">Sin registros de costo de vida</p>
    </div>
    {{end}}
</div>
{{end}}
